<html>

<head>
  <script type="module">
    import { store } from "/plugins/favorite_chats/webui/favorites-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.favChats">
      <div x-init="$store.favChats.init()"></div>
    </template>
  </div>

  <style>
    /* ================================================================
       FAVORITE STAR BUTTON — Base styles
       Strip border/shadow from btn-icon-action, keep spacing
       ================================================================ */
    .fav-star-btn {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    .fav-star-btn:hover {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* SVG star sizing: 30% larger than material-symbols-outlined compact default */
    .fav-star-btn svg {
      width: 21px;
      height: 21px;
      display: inline-block;
      vertical-align: middle;
    }

    /* ================================================================
       FAVORITED STAR — Gold color (all devices)
       No .device-pointer scope so it works everywhere.
       The SVG uses fill="currentColor" so it inherits this color.
       ================================================================ */
    .chat-container .fav-star-btn.active {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      color: #f5a623;
    }

    /* Hover state for non-active star */
    .chat-container:hover .fav-star-btn:not(.active) {
      color: inherit;
    }

    /* ================================================================
       POINTER DEVICES (desktop/laptop)
       Favorited star always visible even without hover.
       ================================================================ */
    .device-pointer .chat-container .fav-star-btn.active {
      display: inline-flex !important;
    }

    .device-pointer .chat-container:hover .fav-star-btn.active {
      display: inline-flex !important;
    }

    /* ================================================================
       TOUCH DEVICES (mobile/tablet)
       Detected via @media (hover: none) and (pointer: coarse).
       A0 hardcodes body.device-pointer and never adds device-touch,
       so we prefix with body.device-pointer for specificity.

       On mobile, favorite stars follow the same pattern as other
       action buttons: hidden by default, shown only when the chat
       is selected or expanded.
       ================================================================ */
    @media (hover: none) and (pointer: coarse) {
      /* Hide favorite star by default on mobile (like all action buttons) */
      body.device-pointer .chat-container .fav-star-btn {
        display: none !important;
        width: 36px;
        height: 36px;
        min-width: 36px;
      }

      /* Show star when chat is selected */
      body.device-pointer .chat-container.chat-selected .fav-star-btn.active {
        display: inline-flex !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        color: #f5a623;
      }

      /* Show all buttons (including star) when actions are expanded */
      body.device-pointer .chat-container.chat-actions-expanded .fav-star-btn {
        display: inline-flex !important;
      }

      body.device-pointer .chat-container.chat-actions-expanded .fav-star-btn.active {
        color: #f5a623;
      }

      /* SVG and icon sizing for touch targets */
      body.device-pointer .chat-container .fav-star-btn svg {
        width: 29px;
        height: 29px;
      }

      body.device-pointer .chat-container .fav-star-btn .material-symbols-outlined {
        font-size: 22px;
      }
    }

    /* ================================================================
       FALLBACK: .device-touch class (if A0 ever adds it dynamically)
       ================================================================ */
    .device-touch .chat-container .fav-star-btn {
      display: none !important;
    }

    .device-touch .chat-container.chat-selected .fav-star-btn.active {
      display: inline-flex !important;
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      color: #f5a623;
    }

    .device-touch .chat-container.chat-actions-expanded .fav-star-btn {
      display: inline-flex !important;
    }

    .device-touch .chat-container .fav-star-btn.active svg {
      width: 29px;
      height: 29px;
    }

    /* ================================================================
       DIVIDER between favorites and non-favorites
       ================================================================ */
    .fav-divider {
      list-style: none;
      height: 0;
      margin: 4px 12px;
      border: none;
      border-top: 1px solid var(--color-border);
      opacity: 0.25;
    }

    .light-mode .fav-divider {
      opacity: 0.35;
    }
  </style>
</body>

</html>
