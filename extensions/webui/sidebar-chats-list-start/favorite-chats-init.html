<html>

<head>
  <script type="module">
    import { store } from "/plugins/favorite_chats/webui/favorites-store.js";
  </script>
</head>

<body>
  <div x-data>
    <template x-if="$store.favChats">
      <div x-init="$store.favChats.init()"></div>
    </template>
  </div>

  <style>
    /* ================================================================
       FAVORITE STAR BUTTON — Base styles
       Strip border/shadow from btn-icon-action, keep spacing.
       Visibility is controlled by chat_rename plugin rules
       (all .chat-list-action-btn hidden by default, shown on
       hover/expanded). We only add color and sizing here.
       ================================================================ */
    .fav-star-btn {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    .fav-star-btn:hover {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }

    /* SVG star sizing: match material-symbols-outlined compact size (16px) */
    .fav-star-btn svg {
      width: 16px;
      height: 16px;
      display: inline-block;
      vertical-align: middle;
    }

    /* ================================================================
       FAVORITED STAR — Gold color (all devices)
       The SVG uses fill="currentColor" so it inherits this color.
       ================================================================ */
    .chat-container .fav-star-btn.active {
      color: #f5a623;
    }

    /* Hover state for non-active star */
    .chat-container:hover .fav-star-btn:not(.active) {
      color: inherit;
    }

    /* ================================================================
       DESKTOP ONLY — Favorited star always visible (no hover needed).
       Uses .fav-star-desktop-visible class added by JS only on
       non-touch devices, so it never fires on mobile.
       ================================================================ */
    .fav-star-desktop-visible .chat-container .fav-star-btn.active {
      display: inline-flex !important;
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    /* ================================================================
       EXPANDED STATE — Gold color for active star when expanded.
       Visibility of .chat-list-action-btn in expanded state is
       already handled by chat_rename plugin.
       ================================================================ */
    .chat-container.chat-actions-expanded .fav-star-btn.active {
      color: #f5a623;
    }

    /* ================================================================
       TOUCH DEVICES — Larger tap targets
       Applied via .fav-star-touch class set by JS on touch devices.
       ================================================================ */
    .fav-star-touch .chat-container .fav-star-btn {
      width: 36px;
      height: 36px;
      min-width: 36px;
    }

    .fav-star-touch .chat-container .fav-star-btn svg {
      width: 22px;
      height: 22px;
    }

    .fav-star-touch .chat-container .fav-star-btn .material-symbols-outlined {
      font-size: 22px;
    }

    /* ================================================================
       DIVIDER between favorites and non-favorites
       ================================================================ */
    .fav-divider {
      list-style: none;
      height: 0;
      margin: 4px 12px;
      border: none;
      border-top: 1px solid var(--color-border);
      opacity: 0.25;
    }

    .light-mode .fav-divider {
      opacity: 0.35;
    }
  </style>
</body>

</html>
